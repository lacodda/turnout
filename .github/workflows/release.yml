name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The archives: the same build CI runs on every push (build.yml).
  build:
    uses: ./.github/workflows/build.yml

  # No release goes out without passing against a real Windows server.
  windows-server:
    uses: ./.github/workflows/windows-server.yml

  release:
    needs: [build, windows-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
      # The changelog's section for the tag, then .github/release-notes.md:
      # the checklist ticked once the release has been through it.
      - name: Write the release notes
        env:
          CHANGES: ${{ steps.cliff.outputs.content }}
        run: |
          printf '%s\n\n' "$CHANGES" > release-notes.md
          cat .github/release-notes.md >> release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: packages/*
