name: Build

# The release archives, built one way for every caller: release.yml on a tag,
# ci.yml on every push - so a tag never meets a build path for the first time.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "turnout-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/turnout.exe", "LICENSE", "README.md" $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Package (macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="turnout-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/turnout" LICENSE README.md "$name"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            turnout-*.zip
            turnout-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Linux binaries link the C library of the machine that built them, and need
  # at least that version to start. Built on the runner's own Ubuntu, 1.0.0
  # needed glibc 2.39 and did not start on Debian 12 or Raspberry Pi OS. The
  # floor is chosen here instead: manylinux_2_28, the image Python's wheels are
  # built in - glibc 2.28, so Debian 10, Ubuntu 20.04, RHEL 8 and newer.
  linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          # Built natively on GitHub's arm runner rather than cross-compiled.
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    env:
      GLIBC_FLOOR: '2.28'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Hold the binary to the glibc floor
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/turnout"
          needed=$(objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "needs glibc $needed, the floor is $GLIBC_FLOOR"
          if [ "$(printf '%s\n%s\n' "$needed" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::turnout needs glibc $needed, above the floor of $GLIBC_FLOOR" >&2
            exit 1
          fi
          # And it starts here, on the floor itself.
          "$binary" --version
      - name: Package
        shell: bash
        run: |
          name="turnout-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/turnout" LICENSE README.md "$name"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: turnout-*.tar.gz
          if-no-files-found: error
          retention-days: 7
