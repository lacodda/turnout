name: Audit examples

# The example apps' packages against the published advisories. Nothing of them
# ships with turnout, but they are what a reader clones and runs `pnpm install`
# in, so a vulnerable lockfile here is handed to whoever follows the guides.
# One job per example, each in its own directory with its own lockfile.
# Advisories accepted on purpose are listed, with the reason, in the example's
# pnpm-workspace.yaml. Monday mornings catch what was published while nothing
# was pushed.
on:
  push:
    branches: [main]
    paths: ['examples/**/package.json', 'examples/**/pnpm-lock.yaml', 'examples/**/pnpm-workspace.yaml', '.github/workflows/examples-audit.yml']
  pull_request:
    paths: ['examples/**/package.json', 'examples/**/pnpm-lock.yaml', 'examples/**/pnpm-workspace.yaml', '.github/workflows/examples-audit.yml']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [deploy-demo, react-demo, vue-demo]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
          cache-dependency-path: examples/${{ matrix.example }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Advisories
        run: pnpm audit
