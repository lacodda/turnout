[package]
name = "turnout"
version = "0.10.4"
edition = "2024"
rust-version = "1.88"
description = "A developer's switchyard: point local apps at any backend stand, keep servers and secrets at hand, build and deploy from any directory"
license = "MIT"
repository = "https://github.com/lacodda/turnout"
homepage = "https://github.com/lacodda/turnout"
readme = "README.md"
keywords = ["cli", "developer-tools", "proxy", "deploy", "environment"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
# assets/icon.ico is required by build.rs on Windows; the rest of the brand
# artwork only serves GitHub and the docs site.
exclude = [
    "docs/",
    ".github/",
    "examples/",
    "cliff.toml",
    "rustfmt.toml",
    "assets/social-preview.png",
    "assets/logo-512.png",
    "assets/apple-touch-icon.png",
    "assets/favicon-32.png",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
anyhow = "1"
arboard = "3"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
chacha20poly1305 = "0.11.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6.8"
cliclack = "0.5.6"
dialoguer = "0.12"
directories = "6"
dunce = "1"
flate2 = "1.1.9"
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
# Rides along with cliclack anyway; used directly only for HumanBytes formatting.
indicatif = "0.18.6"
keyring = { version = "4", features = ["v1"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rustls = "0.23"
russh = "0.63"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "io-util"] }
# The rustls feature is load-bearing: the gateway's default WebSocket path
# passes `None` as the connector and relies on tungstenite's built-in rustls
# (see websocket_proxy in gateway.rs); only the accept-invalid-certs path
# builds its own config.
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
predicates = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
