[package]
name = "turnout"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A developer's switchyard: point local apps at any backend stand, keep servers and secrets at hand, build and deploy from any directory"
license = "MIT"
repository = "https://github.com/lacodda/turnout"
homepage = "https://github.com/lacodda/turnout"
readme = "README.md"
keywords = ["cli", "developer-tools", "proxy", "deploy", "environment"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
exclude = ["docs/", ".github/", "cliff.toml", "rustfmt.toml"]

[dependencies]
anyhow = "1"
arboard = "3"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6.8"
dialoguer = "0.11"
directories = "6"
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
native-tls = "0.2.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

[dev-dependencies]
assert_cmd = "2"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
predicates = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-tungstenite = "0.30.0"
